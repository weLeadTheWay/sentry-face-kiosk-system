name: Mirror to weLeadTheWay repo

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to team repo
        run: |
          git remote add sync https://x-access-token:${{ secrets.SENTRY_FACEKIOSK_TOKEN }}@github.com/weLeadTheWay/sentry-face-kiosk-system.git
          git push sync HEAD:main --force