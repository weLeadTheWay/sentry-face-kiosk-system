name: Mirror to weLeadTheWay repo

on:
  push:
    branches: [main]     # change if your default branch is "master" or something else
  workflow_dispatch:      # lets you trigger it manually from the Actions tab too

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to team repo
        run: |
          git remote add mirror https://x-access-token:${{ secrets.SENTRY_FACEKIOSK_TOKEN }}@github.com/weLeadTheWay/sentry-face-kiosk-system
          git push mirror HEAD:main --force