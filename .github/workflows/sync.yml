name: Mirror LRS prod to WLTW dev

on:
  push:
    branches: [prod]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo (full history)
        uses: actions/checkout@v4
        with:
          ref: prod
          fetch-depth: 0
          persist-credentials: false

      - name: Strip LRS-only workflows, inject WLTW's own mirror workflow
        run: |
          cp .github/wltw-mirror-workflow.yml /tmp/mirror-dev-to-prod.yml
          rm -rf .github/workflows
          mkdir -p .github/workflows
          mv /tmp/mirror-dev-to-prod.yml .github/workflows/mirror-dev-to-prod.yml
          rm -f .github/wltw-mirror-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mirror LRS prod (LRS-only workflows stripped)" --allow-empty

      - name: Push to WLTW dev
        run: |
          git remote add sync https://x-access-token:${{ secrets.SENTRY_FACEKIOSK_TOKEN }}@github.com/weLeadTheWay/sentry-face-kiosk-system.git
          git push sync HEAD:dev --force
